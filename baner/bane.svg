<svg width="100%" viewBox="0 0 680 480" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Racerbane</title>
<desc>Racerbane med jevn bredde, kantsteiner kun i svinger, trær langt fra banen</desc>

<defs>
  <pattern id="kerbpat" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">
    <rect width="12" height="6" fill="#cc2222"/>
    <rect y="6" width="12" height="6" fill="#eeeeee"/>
  </pattern>
  <pattern id="checker" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#ffffff"/>
    <rect width="4" height="4" fill="#000000"/>
    <rect x="4" y="4" width="4" height="4" fill="#000000"/>
  </pattern>
</defs>

<!-- Gress -->
<rect width="680" height="480" fill="#4a8040"/>

<!-- LAG 1: Runoff (sand) -->
<path d="M 110,408 L 545,408 Q 615,408 638,348 L 643,282 Q 647,235 616,204 L 568,174 Q 540,157 500,153 L 452,151 Q 424,151 410,128 L 399,102 Q 388,75 354,65 L 282,61 Q 230,59 194,82 L 163,107 Q 140,128 136,162 L 133,208 Q 131,240 107,259 L 82,279 Q 55,302 55,342 Q 55,378 110,408 Z"
  fill="none" stroke="#d4b896" stroke-width="86" stroke-linejoin="round" stroke-linecap="round"/>

<!-- LAG 2: Kantsteiner kun i svingene -->
<path d="M 530,408 Q 615,408 638,348 L 643,296" fill="none" stroke="url(#kerbpat)" stroke-width="60" stroke-linecap="round"/>
