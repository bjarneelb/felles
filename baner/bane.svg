<path d="M 176,94 Q 140,128 136,162 L 133,220" fill="none" stroke="url(#kerbpat)" stroke-width="60" stroke-linecap="round"/>

<!-- LAG 3: Asfalt -->
<path d="M 110,408 L 545,408 Q 615,408 638,348 L 643,282 Q 647,235 616,204 L 568,174 Q 540,157 500,153 L 452,151 Q 424,151 410,128 L 399,102 Q 388,75 354,65 L 282,61 Q 230,59 194,82 L 163,107 Q 140,128 136,162 L 133,208 Q 131,240 107,259 L 82,279 Q 55,302 55,342 Q 55,378 110,408 Z"
  fill="none" stroke="#2d2d2d" stroke-width="58" stroke-linejoin="round" stroke-linecap="round"/>

<!-- LAG 4: Midtlinje -->
<path d="M 110,408 L 545,408 Q 615,408 638,348 L 643,282 Q 647,235 616,204 L 568,174 Q 540,157 500,153 L 452,151 Q 424,151 410,128 L 399,102 Q 388,75 354,65 L 282,61 Q 230,59 194,82 L 163,107 Q 140,128 136,162 L 133,208 Q 131,240 107,259 L 82,279 Q 55,302 55,342 Q 55,378 110,408 Z"
  fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="14,10" stroke-linejoin="round" stroke-linecap="round" opacity="0.5"/>

<!-- PIT LANE -->
<line x1="110" y1="408" x2="455" y2="408" stroke="#111111" stroke-width="18"/>
<line x1="112" y1="408" x2="453" y2="408" stroke="#ffdd00" stroke-width="1.2" stroke-dasharray="8,6" opacity="0.85"/>

<!-- STARTSTRIPE -->
<rect x="197" y="382" width="24" height="52" fill="url(#checker)" rx="1"/>

